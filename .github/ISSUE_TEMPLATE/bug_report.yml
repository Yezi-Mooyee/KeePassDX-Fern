# Fork notice: this file is based on the upstream issue template of KeePassDX and has been
# modified for KeePassDX Fern. Modifications copyright © 2026 Yezi Mooyee, GPLv3.
name: Bug report
description: Report a bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the bug tracker of **KeePassDX Fern**, an unofficial fork which currently only ships the **libre** build.

        Before opening an issue, please:
        1. search [the issues of this fork](https://github.com/Yezi-Mooyee/KeePassDX-Fern/issues?q=is%3Aissue%20state%3Aopen%20label%3Abug), the [upstream issues](https://github.com/Kunzisoft/KeePassDX/issues) and the [upstream Wiki](https://github.com/Kunzisoft/KeePassDX/wiki) to see whether the problem has already been reported;
        2. check whether the problem also happens with the upstream KeePassDX build. A problem that only appears here comes from this fork; a problem that also appears upstream probably comes from upstream.

        If you are not sure which project the problem belongs to, **report it here first**. I would rather receive an issue that turns out to belong upstream than send a fork-specific issue upstream.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have read the Wiki, searched the open issues, and still think this is a new bug.
          required: true
  - type: textarea
    id: bug
    attributes:
      label: "Explain the problem clearly and succinctly:"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Describe what you expected to happen:"
  - type: input
    id: app-version
    attributes:
      label: "KeePassDX Fern version:"
    validations:
      required: true
  - type: dropdown
    id: app-build
    attributes:
      label: "Build:"
      multiple: true
      options:
        - Libre
    validations:
      required: true
  - type: input
    id: database-version
    attributes:
      label: "Database version:"
  - type: input
    id: file-provider
    attributes:
      label: "File provider (`content://` URI)"
  - type: input
    id: android-version
    attributes:
      label: "Android version:"
  - type: input
    id: android-device
    attributes:
      label: "Android device:"
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context:"
