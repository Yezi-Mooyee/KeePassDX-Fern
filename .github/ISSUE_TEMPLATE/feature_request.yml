# Fork notice: this file is based on the upstream issue template of KeePassDX and has been
# modified for KeePassDX Fern. Modifications copyright © 2026 Yezi Mooyee, GPLv3.
name: Feature request
description: Suggest an idea.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        This is the feature tracker of **KeePassDX Fern**, an unofficial fork. This fork only accepts changes to the outer layers (interface, input method, preferences).

        Before opening an issue, please:
        1. search [the issues of this fork](https://github.com/Yezi-Mooyee/KeePassDX-Fern/issues?q=is%3Aissue%20state%3Aopen%20label%3Afeature), the [upstream issues](https://github.com/Kunzisoft/KeePassDX/issues) and the [upstream Wiki](https://github.com/Kunzisoft/KeePassDX/wiki) to see whether your feature has already been requested;
        2. decide whether it is a feature of this fork or of upstream.

        If you are not sure which project it belongs to, **open it here first**. I would rather receive a request that turns out to belong upstream than send a fork-specific request upstream.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have read the Wiki, searched the open issues, and still think this is a new feature.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "Explain the problem clearly and succinctly:"
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like:"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered:"
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context:"
